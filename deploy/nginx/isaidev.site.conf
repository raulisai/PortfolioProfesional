# Copiar a /etc/nginx/sites-available/isaidev.site (o conf.d/isaidev.site.conf) y activar.
# Después: sudo certbot --nginx -d isaidev.site -d www.isaidev.site   (añade el HTTPS y la redirección 80 -> 443)
# Si cambias APP_PORT en el servidor, cambia también el puerto del proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name isaidev.site www.isaidev.site;

    if ($host = www.isaidev.site) {
        return 301 $scheme://isaidev.site$request_uri;
    }

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Se activa cuando ya exista el HTTPS (certbot):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Archivos con hash en el nombre: cache de un año
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        expires 1y;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
