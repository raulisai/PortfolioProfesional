# Se copia al servidor (por defecto /opt/portfolio) en cada despliegue.
# IMAGE, TAG y APP_PORT las escribe el workflow en el .env del servidor.
# nginx (que ya corre en el servidor) hace de proxy hacia 127.0.0.1:APP_PORT.
services:
  app:
    image: ${IMAGE:?falta IMAGE}:${TAG:-latest}
    restart: unless-stopped
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_FROM: ${CONTACT_FROM:-Portafolio <onboarding@resend.dev>}
    ports:
      - "127.0.0.1:${APP_PORT:-4321}:4321"   # solo accesible desde el propio servidor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
